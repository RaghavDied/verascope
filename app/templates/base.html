<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VeraScope</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f5fa; }
    .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); border-radius: 14px; }
    .verdict-fake { color: #d62839; font-weight: 700; }
    .verdict-real { color: #2e8b57; font-weight: 700; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">VeraScope</span>
      <span class="text-white-50">AI Deepfake Detection & Evidence Verification</span>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
