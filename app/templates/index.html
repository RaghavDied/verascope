{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4">
      <h4 class="mb-1">Upload media for verification</h4>
      <p class="text-muted">Supported: JPG, PNG, JPEG (image) or MP4, AVI (video)</p>

      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form action="/analyze" method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <input class="form-control" type="file" name="media" accept=".jpg,.jpeg,.png,.mp4,.avi" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">Analyze</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
